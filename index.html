<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jack Bauer — TikTok Legal</title>
  <style>
    :root { color-scheme: dark; --bg:#071018; --card:#0d1b27; --ink:#f5f0e7; --muted:#b8c4cc; --gold:#d6a64c; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; font-family:Arial,sans-serif; background:var(--bg); color:var(--ink); }
    main { width:min(680px,100%); background:var(--card); padding:42px; border:1px solid #233747; border-radius:18px; }
    .mark { color:var(--gold); font-weight:700; letter-spacing:.12em; } h1 { margin:.3em 0 .35em; font-size:clamp(2rem,6vw,3.3rem); } p { color:var(--muted); line-height:1.6; } nav { display:grid; gap:12px; margin-top:28px; } a { display:block; padding:16px; border:1px solid #30495d; border-radius:10px; color:var(--ink); text-decoration:none; font-weight:700; } a:hover { border-color:var(--gold); color:var(--gold); } footer { margin-top:32px; font-size:.9rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="mark">JACK BAUER</div>
    <h1>TikTok Legal</h1>
    <p>Legal notices for the Jack Bauer personal assistant integration with TikTok.</p>
    <nav>
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </nav>
    <footer>Last updated: September 28, 2026.</footer>
  </main>
</body>
</html>
